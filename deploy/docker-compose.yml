services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: codex_manage
      POSTGRES_USER: codex_manage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - codex-manage-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codex_manage -d codex_manage"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    image: ${CONTROL_API_IMAGE:-registry.cn-hangzhou.aliyuncs.com/foxhello/codex-manage-control-api:20260722-8719275}
    environment: &control-environment
      DATABASE_URL: postgres://codex_manage:${POSTGRES_PASSWORD}@postgres:5432/codex_manage
      CONTROL_HOST: 0.0.0.0
      CONTROL_PORT: 4320
      CONTROL_DEVICE_DOMAIN: xmwefun.cn
      CONTROL_ADMIN_ORIGIN: ${CONTROL_ADMIN_ORIGIN:-https://codex-admin.xmwefun.cn,http://192.168.31.107}
      CONTROL_ALLOW_DEBUG_CODES: ${CONTROL_ALLOW_DEBUG_CODES:-false}
      CONTROL_EMAIL_WEBHOOK_URL: ${CONTROL_EMAIL_WEBHOOK_URL:-}
      CONTROL_SMS_WEBHOOK_URL: ${CONTROL_SMS_WEBHOOK_URL:-}
      CONTROL_BOOTSTRAP_ADMIN_EMAIL: ${CONTROL_BOOTSTRAP_ADMIN_EMAIL:-}
      CONTROL_BOOTSTRAP_ADMIN_PASSWORD: ${CONTROL_BOOTSTRAP_ADMIN_PASSWORD:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}
    command: ["node", "dist/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy

  control-api:
    image: ${CONTROL_API_IMAGE:-registry.cn-hangzhou.aliyuncs.com/foxhello/codex-manage-control-api:20260722-8719275}
    restart: unless-stopped
    environment: *control-environment
    ports:
      - "${CONTROL_API_BIND_ADDRESS:-0.0.0.0}:${CONTROL_API_PUBLISHED_PORT:-4320}:4320"
    depends_on:
      migrate:
        condition: service_completed_successfully

  tunnel-worker:
    image: ${CONTROL_API_IMAGE:-registry.cn-hangzhou.aliyuncs.com/foxhello/codex-manage-control-api:20260722-8719275}
    restart: unless-stopped
    environment: *control-environment
    command: ["node", "dist/worker.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  admin-web:
    image: ${ADMIN_WEB_IMAGE:-registry.cn-hangzhou.aliyuncs.com/foxhello/codex-manage-admin-web:20260722-8719275}
    restart: unless-stopped
    ports:
      - "${ADMIN_WEB_BIND_ADDRESS:-0.0.0.0}:${ADMIN_WEB_PUBLISHED_PORT:-80}:80"

  download-web:
    image: nginx:1.29-alpine
    restart: unless-stopped
    volumes:
      - ../downloads:/usr/share/nginx/html:ro
      - ./download-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${DOWNLOAD_WEB_BIND_ADDRESS:-0.0.0.0}:${DOWNLOAD_WEB_PUBLISHED_PORT:-8080}:80"

volumes:
  codex-manage-postgres:
